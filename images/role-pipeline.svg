<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Who Is True 프로젝트 역할 흐름</title><desc id="desc">공동 제작과 서사 기획부터 선택지 설계, Twine 구현, 상태 관리, 반복 플레이 검증으로 이어지는 역할 흐름</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient><linearGradient id="accent"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><style>.head{fill:#fff;font-size:21px;font-weight:700}.body{fill:#cbd5e1;font-size:15px}.num{fill:#fff;font-size:16px;font-weight:700}</style></defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif"><rect x="42" y="36" width="9" height="52" rx="4.5" fill="url(#accent)"/><text x="72" y="63" fill="#f8fafc" font-size="28" font-weight="700">나의 역할 · 사회적 선택을 131개 분기의 서사 게임으로</text><text x="72" y="88" fill="#94a3b8" font-size="15">최지원 · 김서영 공동 제작 및 공동 기획 · 서사 설계부터 반복 플레이 검증까지 참여</text>
  <g transform="translate(42 130)"><rect width="190" height="145" rx="18" fill="#312e81" stroke="#6366f1" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#6366f1"/><text class="num" x="30" y="37" text-anchor="middle">1</text><text class="head" x="20" y="70">공동 제작·기획</text><text class="body" x="20" y="102">최지원 · 김서영</text><text class="body" x="20" y="126">작품 방향 공동 결정</text></g>
  <g transform="translate(268 130)"><rect width="190" height="145" rx="18" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#3b82f6"/><text class="num" x="30" y="37" text-anchor="middle">2</text><text class="head" x="20" y="70">서사 구조</text><text class="body" x="20" y="102">중심 미스터리 · 장 순서</text><text class="body" x="20" y="126">정보 공개 흐름</text></g>
  <g transform="translate(494 130)"><rect width="190" height="145" rx="18" fill="#164e63" stroke="#06b6d4" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#06b6d4"/><text class="num" x="30" y="37" text-anchor="middle">3</text><text class="head" x="20" y="70">선택지 설계</text><text class="body" x="20" y="102">신뢰 · 의심 · 개입</text><text class="body" x="20" y="126">언론 해석과 태도</text></g>
  <g transform="translate(720 130)"><rect width="190" height="145" rx="18" fill="#134e4a" stroke="#14b8a6" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#14b8a6"/><text class="num" x="30" y="37" text-anchor="middle">4</text><text class="head" x="20" y="70">Twine 구현</text><text class="body" x="20" y="102">Passage 작성 · 연결</text><text class="body" x="20" y="126">131개 분기 구성</text></g>
  <g transform="translate(946 130)"><rect width="190" height="145" rx="18" fill="#365314" stroke="#84cc16" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#84cc16"/><text class="num" x="30" y="37" text-anchor="middle">5</text><text class="head" x="20" y="70">진행 상태 관리</text><text class="body" x="20" y="102">장 해금 · 누적 변수</text><text class="body" x="20" y="126">엔딩 상태 연결</text></g>
  <g transform="translate(1172 130)"><rect width="186" height="145" rx="18" fill="#713f12" stroke="#f59e0b" stroke-width="2"/><circle cx="30" cy="31" r="16" fill="#f59e0b"/><text class="num" x="30" y="37" text-anchor="middle">6</text><text class="head" x="20" y="70">반복 플레이 QA</text><text class="body" x="20" y="102">선택 경로 · 진행 차단</text><text class="body" x="20" y="126">메뉴 복귀 확인</text></g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M235 202H258"/><path d="M461 202H484"/><path d="M687 202H710"/><path d="M913 202H936"/><path d="M1139 202H1162"/></g><path d="M42 302H1358" stroke="#334155"/><text x="700" y="332" text-anchor="middle" fill="#cbd5e1" font-size="16">핵심 기여: 공동 기획 · 서사와 선택지 설계 · Twine 분기 구현 · 상태 관리 · 플레이 검증</text></g>
</svg>
